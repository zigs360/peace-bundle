services:
  # 1. Self-hosted PostgreSQL 18 Database
  db:
    image: postgres:18-alpine
    container_name: peacebundle_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peacebundlle}
      POSTGRES_USER: ${POSTGRES_USER:-peacebundlle_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-peacebundlle_user} -d $${POSTGRES_DB:-peacebundlle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - peacebundle_net

  # 2. Node.js Backend API & Realtime Worker
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peacebundle_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-peacebundlle_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-peacebundlle}
      DB_SSL: "false"
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN_NAME:-peacebundlle.com}}
    volumes:
      - uploads_data:/app/uploads
      - secure_uploads_data:/app/secure_uploads
    networks:
      - peacebundle_net

  # 3. React Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: peacebundle_frontend
    restart: unless-stopped
    networks:
      - peacebundle_net

  # 4. Nginx Reverse Proxy with SSL Termination (Routes to Frontend & Backend)
  nginx:
    image: nginx:1.27-alpine
    container_name: peacebundle_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3080}:80"
      - "${HTTPS_PORT:-3443}:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-peacebundlle.com}
      API_DOMAIN: ${API_DOMAIN:-api.peacebundlle.com}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/docker-entrypoint.d:/docker-entrypoint.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:rw
    depends_on:
      - backend
      - frontend
    networks:
      - peacebundle_net

  # 5. Certbot Auto-Renewing SSL Service
  certbot:
    image: certbot/certbot:latest
    container_name: peacebundle_certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - peacebundle_net

volumes:
  postgres_data:
    name: peacebundle_postgres_data
  uploads_data:
    name: peacebundle_uploads_data
  secure_uploads_data:
    name: peacebundle_secure_uploads_data
  certbot_www:
    name: peacebundle_certbot_www
  certbot_conf:
    name: peacebundle_certbot_conf

networks:
  peacebundle_net:
    name: peacebundle_net
    driver: bridge
